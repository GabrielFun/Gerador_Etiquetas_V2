<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas - V2</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e2329; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: #2b313c; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
        }
        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px; 
            color: #f39c12;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            font-size: 14px;
        }
        select, input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background-color: #1e2329;
            color: white;
            box-sizing: border-box; 
            font-size: 15px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #f39c12;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #f39c12; 
            color: #1e2329; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.3s ease;
        }
        button:hover { 
            background-color: #e67e22; 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- NOVO: Bloco do Logotipo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="New Post Logística" style="max-width: 180px; height: auto;">
        </div>

        <h2>Emissão de Etiquetas V2</h2>
        <form method="POST">
            
            <!-- NOVA CAIXA: ORIGEM -->
            <label for="origem">Origem (Expedidor):</label>
            <select name="origem" id="origem" required>
                <option value="" disabled selected>Selecione de onde está saindo...</option>
                {% for o in origens %}
                    <option value="{{ o }}">{{ o }}</option>
                {% endfor %}
            </select>

            <!-- CAIXA EXISTENTE: DESTINO -->
            <label for="sigla">Destino (Recebedor):</label>
            <select name="sigla" id="sigla" required>
                <option value="" disabled selected>Selecione para onde vai...</option>
                {% for d in destinos %}
                    <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>

            <!-- QUANTIDADE -->
            <label for="quantidade">Quantidade de Volumes:</label>
            <input type="number" name="quantidade" id="quantidade" min="1" placeholder="Ex: 5" required>

            <button type="submit">Gerar Etiquetas em PDF</button>
        </form>
    </div>
</body>
</html>
